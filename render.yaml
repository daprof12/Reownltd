# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: reown-website
    runtime: node
    plan: starter            # a paid plan is required for the persistent disk below
    region: frankfurt        # closest Render region to Nigeria
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: reown-data
      mountPath: /var/data   # content, leads, subscribers and uploads live here
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data/content
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SITE_URL
        value: https://www.reownltd.com
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you for this when you create the Blueprint
      - key: SESSION_SECRET
        generateValue: true
      - key: LEADS_TO
        value: info@reownltd.com
      # Optional: email alerts for new leads (fill in on Render)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
